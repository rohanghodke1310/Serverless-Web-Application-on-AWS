<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, modern serverless greeting application powered by AWS.">
  <title>Greeting App | A Monk in Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <main class="main-content">
    <section class="hero-card" aria-labelledby="page-title">
      <div class="hero-icon" aria-hidden="true">👋</div>
      <p class="eyebrow">Welcome</p>
      <h2 id="page-title">Say hello in the cloud.</h2>
      <p class="hero-text">
        Enter your name below and let this serverless app create a personalized greeting.
      </p>

      <form id="greeting-form" novalidate>
        <div class="form-group">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="80"
            required
          >
          <p class="input-hint">We’ll use your name to create a friendly greeting.</p>
        </div>

        <button type="submit" id="submit-btn">
          <span>Show greeting</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <div id="greeting" class="greeting" role="status" aria-live="polite" hidden></div>
    </section>

    <p class="tech-note">
      Built with <span>AWS Lambda</span> · <span>DynamoDB</span> · <span>S3</span>
    </p>
  </main>

  <footer class="site-footer">
    <p>© 2026 A Monk in Cloud · Built for the serverless journey.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
